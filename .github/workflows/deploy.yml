name: DevOps MiniStack CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  terraform-ci:

    name: Terraform CI

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate


  terraform-cd:

    name: Deploy Infrastructure

    needs: terraform-ci

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Start MiniStack
        run: |
          docker run -d \
            --name ministack \
            -p 4566:4566 \
            ministackorg/ministack

          for i in $(seq 1 30); do
            if curl --fail --silent \
              http://localhost:4566/_ministack/health; then
              echo "MiniStack is ready"
              break
            fi

            sleep 2
          done

          curl --fail \
            http://localhost:4566/_ministack/health

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Install Python Dependencies
        run: pip install boto3

      - name: Run Infrastructure Tests
        run: python ../scripts/test_resources.py

      - name: Show Terraform Outputs
        run: terraform output

      - name: Show MiniStack Logs On Failure
        if: failure()
        run: docker logs ministack